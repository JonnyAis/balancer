accounts:
  exclude_if_desc_contains:
  - brokerage
  include_only_descriptions: []
classes:
  Bonds:
    preferred_symbol: BND
    target_percent: 20
  International:
    preferred_symbol: IXUS
    target_percent: 28
  Large:
    preferred_symbol: VOO
    target_percent: 40
  Small:
    preferred_symbol: VBR
    target_percent: 12
loop:
  enabled: true
  interval_minutes: 30
rebalance:
  account_min_turnover: 200
  cash_buffer: 0
  integer_optimizer:
    turnover_penalty: 0.0
    window: 10
  max_notional_trade: 20000
  min_notional_trade: 200
  min_percent_drift: 0.2
trading:
  mode: auto
  order_type: LIMIT          # MARKET or LIMIT
  limit_tolerance_pct: 0.5   # For LIMIT orders: buy at last*(1+tol), sell at last*(1-tol)
  daily_max_turnover: 100000   # Max dollar turnover per calendar day (0 = unlimited)
  daily_max_trades: 50         # Max individual orders per calendar day (0 = unlimited)
